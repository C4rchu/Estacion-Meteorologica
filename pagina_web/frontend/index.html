<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estación Meteorológica ET25</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <img src="/static/et25.png" alt="Logo ET25" class="logo">
            <h1>Estación Meteorológica ET25</h1>
            <div id="timestamp">Última actualización: --:--:--</div>
        </header>
        
        <div class="grid">
            <div class="card weather-icon">
                <img id="weather-img" src="/static/clima/sol.png" alt="Clima">
            </div>
            <div class="card"><span>Temperatura</span><div id="temp">--</div>°C</div>
            <div class="card"><span>Humedad</span><div id="hum">--</div>%</div>
            <div class="card"><span>Presión</span><div id="pres">--</div>hPa</div>
            <div class="card"><span>Radiación UV</span><div id="uv">--</div></div>
            <div class="card"><span>Vel. Viento</span><div id="wind">--</div>km/h</div>
            <div class="card"><span>Dir. Viento</span><div id="dir">--</div></div>
            <div class="card" id="rain-card"><span>Precipitaciones</span><div id="rain">--</div></div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
